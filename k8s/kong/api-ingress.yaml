apiVersion: v1
kind: Service
metadata:
  name: oficina360-auth-lambda
  namespace: oficina360
  annotations:
    konghq.com/protocol: "https"
    konghq.com/path: "/Prod"
spec:
  type: ExternalName
  externalName: ${AUTH_API_HOST}
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina360-api
  namespace: oficina360
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: oficina360-api
                port:
                  number: 8080

          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: oficina360-auth-lambda
                port:
                  number: 443