replicas: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

persistence:
  enabled: false

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: observability

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        isDefault: true
        editable: false

grafana.ini:
  server:
    root_url: "%(protocol)s://%(http_host)s/grafana/"
    serve_from_sub_path: true
