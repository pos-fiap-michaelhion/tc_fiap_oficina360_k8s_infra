name: Infrastructure Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oficina360-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: oficina360
  TF_VAR_kubernetes_version: "1.36"

jobs:
  destroy:
    name: Infrastructure Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: terraform/lab

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Configurar Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS
        timeout-minutes: 1
        working-directory: .
        run: |
          set -euo pipefail

          IDENTITY_JSON="$(
            aws sts get-caller-identity \
              --output json
          )"

          ACCOUNT_ID="$(
            jq -r '.Account' <<< "$IDENTITY_JSON"
          )"

          CALLER_ARN="$(
            jq -r '.Arn' <<< "$IDENTITY_JSON"
          )"

          USER_ID="$(
            jq -r '.UserId' <<< "$IDENTITY_JSON"
          )"

          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$CALLER_ARN"
          echo "::add-mask::$USER_ID"

          SESSION_NAME="${CALLER_ARN##*/}"

          if [[ -n "$SESSION_NAME" ]]; then
            echo "::add-mask::$SESSION_NAME"
          fi

          if [[ "$SESSION_NAME" == *"="* ]]; then
            SESSION_IDENTITY="${SESSION_NAME##*=}"
            echo "::add-mask::$SESSION_IDENTITY"
          fi

          echo "Identidade AWS validada com sucesso."

      - name: Configurar roles EKS
        timeout-minutes: 1
        working-directory: .
        env:
          EKS_CLUSTER_ROLE_ARN: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
          EKS_NODE_ROLE_ARN: ${{ vars.EKS_NODE_ROLE_ARN }}
        run: |
          set -euo pipefail

          : "${EKS_CLUSTER_ROLE_ARN:?Repository Variable EKS_CLUSTER_ROLE_ARN nao definida}"
          : "${EKS_NODE_ROLE_ARN:?Repository Variable EKS_NODE_ROLE_ARN nao definida}"

          if [[ ! "$EKS_CLUSTER_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::EKS_CLUSTER_ROLE_ARN nao e um ARN IAM Role valido."
            exit 1
          fi

          if [[ ! "$EKS_NODE_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::EKS_NODE_ROLE_ARN nao e um ARN IAM Role valido."
            exit 1
          fi

          echo "TF_VAR_eks_cluster_role_arn=$EKS_CLUSTER_ROLE_ARN" >> "$GITHUB_ENV"
          echo "TF_VAR_eks_node_role_arn=$EKS_NODE_ROLE_ARN" >> "$GITHUB_ENV"

      - name: Configurar backend
        timeout-minutes: 1
        working-directory: .
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'oficina360/lab.tfstate' }}
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Repository Variable TF_STATE_BUCKET nao definida}"
          : "${TF_STATE_KEY:?Repository Variable TF_STATE_KEY nao definida}"

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"

          echo "::add-mask::$TF_STATE_BUCKET"
          echo "::add-mask::$TF_STATE_KEY"
          echo "Backend Terraform configurado."

      - name: Terraform init
        run: |
          set -euo pipefail

          terraform init \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Verificar state antes do destroy
        run: |
          set -euo pipefail

          CURRENT_WORKSPACE="$(terraform workspace show)"

          if [[ "$CURRENT_WORKSPACE" != "default" ]]; then
            echo "::error::Workspace inesperado: $CURRENT_WORKSPACE"
            exit 1
          fi

          terraform state pull > /tmp/current-state.tfstate

          if ! jq -e '.version and (.resources | type == "array")' \
            /tmp/current-state.tfstate >/dev/null; then
            echo "::error::O backend nao retornou um state Terraform valido."
            exit 1
          fi

          mapfile -t STATE_RESOURCES < <(terraform state list)
          RESOURCE_COUNT="${#STATE_RESOURCES[@]}"

          printf '%s\n' "${STATE_RESOURCES[@]}" \
            > /tmp/terraform-state-resources.txt

          echo "===== RECURSOS NO STATE ====="
          cat /tmp/terraform-state-resources.txt
          echo
          echo "Total: $RESOURCE_COUNT"

          if (( RESOURCE_COUNT == 0 )); then
            echo "::error::O state Terraform esta vazio."
            echo "::error::Destroy interrompido para evitar operar com state incorreto."
            exit 1
          fi

          if ! grep -Fxq "module.vpc.aws_vpc.this[0]" \
            /tmp/terraform-state-resources.txt; then
            echo "::error::A VPC esperada nao esta presente no state."
            echo "::error::Destroy interrompido para evitar usar um state incorreto."
            exit 1
          fi

          if grep -Fxq "aws_eks_cluster.main" \
            /tmp/terraform-state-resources.txt; then
            echo "EKS ainda presente no state; destroy completo sera executado."
          else
            echo "::notice::EKS ja foi removido em uma tentativa anterior."
            echo "::notice::O workflow continuara a partir dos recursos restantes."
          fi

          echo "State valido para destroy inicial ou retomada."

      - name: Terraform validate
        timeout-minutes: 2
        run: |
          set -euo pipefail
          terraform validate

      - name: Salvar VPC ID antes da limpeza
        timeout-minutes: 2
        run: |
          set -euo pipefail

          VPC_ID="$(terraform output -raw vpc_id)"

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"
          echo "VPC encontrada: $VPC_ID"

      - name: Configurar acesso ao EKS
        working-directory: .
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'oficina360' }}
        run: |
          set -euo pipefail

          : "${EKS_CLUSTER_NAME:?Repository Variable EKS_CLUSTER_NAME nao definida}"

          if ! CLUSTER_STATUS="$(
            aws eks describe-cluster \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query 'cluster.status' \
              --output text \
              2>/tmp/eks-describe-error.txt
          )"; then
            echo "::warning::Cluster EKS nao encontrado ou inacessivel."
            cat /tmp/eks-describe-error.txt
            echo "EKS_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$CLUSTER_STATUS" != "ACTIVE" ]]; then
            echo "::warning::Cluster EKS nao esta ACTIVE. Status: $CLUSTER_STATUS"
            echo "EKS_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          export KUBECONFIG="$RUNNER_TEMP/oficina360-kubeconfig"
          rm -f "$KUBECONFIG"

          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          echo "EKS_AVAILABLE=true" >> "$GITHUB_ENV"

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias oficina360 \
            --kubeconfig "$KUBECONFIG"

          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Remover releases Helm
        if: env.EKS_AVAILABLE == 'true'
        timeout-minutes: 15
        working-directory: .
        run: |
          set -u

          uninstall_release() {
            local release="$1"
            local namespace="$2"

            if helm status "$release" --namespace "$namespace" >/dev/null 2>&1; then
              echo "Removendo release $release do namespace $namespace..."

              helm uninstall "$release" \
                --namespace "$namespace" \
                --wait \
                --timeout 5m || {
                  echo "::warning::Falha ao remover release $release; a limpeza dos namespaces continuara."
                }
            else
              echo "Release $release nao existe em $namespace."
            fi
          }

          uninstall_release alloy observability
          uninstall_release grafana observability
          uninstall_release loki observability
          uninstall_release kong kong

      - name: Remover namespaces externos ao Terraform
        if: env.EKS_AVAILABLE == 'true'
        timeout-minutes: 12
        working-directory: .
        run: |
          set -euo pipefail

          for namespace in observability kong oficina360; do
            echo "Solicitando remocao do namespace $namespace..."
            kubectl delete namespace "$namespace" \
              --ignore-not-found=true \
              --wait=false
          done

          for attempt in $(seq 1 60); do
            remaining=0

            for namespace in observability kong oficina360; do
              if kubectl get namespace "$namespace" >/dev/null 2>&1; then
                echo "Namespace ainda presente: $namespace"
                remaining=$((remaining + 1))
              fi
            done

            if [[ "$remaining" -eq 0 ]]; then
              echo "Namespaces externos ao Terraform removidos."
              exit 0
            fi

            if [[ "$attempt" -lt 60 ]]; then
              sleep 10
            fi
          done

          echo "::error::Um ou mais namespaces nao foram removidos no prazo."
          kubectl get namespaces || true
          exit 1

      - name: Aguardar remocao dos Load Balancers da VPC
        timeout-minutes: 12
        env:
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          : "${VPC_ID:?VPC_ID nao foi salvo antes da limpeza}"

          echo "Aguardando remocao dos Load Balancers da VPC $VPC_ID..."

          for attempt in $(seq 1 60); do
            if ! CLASSIC_JSON="$(
              aws elb describe-load-balancers \
                --region "$AWS_REGION" \
                --output json \
                2>/tmp/classic-lb-error.txt
            )"; then
              echo "::error::Falha ao consultar Classic Load Balancers."
              cat /tmp/classic-lb-error.txt
              exit 1
            fi

            if ! V2_JSON="$(
              aws elbv2 describe-load-balancers \
                --region "$AWS_REGION" \
                --output json \
                2>/tmp/v2-lb-error.txt
            )"; then
              echo "::error::Falha ao consultar ALB/NLB."
              cat /tmp/v2-lb-error.txt
              exit 1
            fi

            if ! jq -e '.LoadBalancerDescriptions | type == "array"' \
              <<< "$CLASSIC_JSON" >/dev/null; then
              echo "::error::Resposta invalida da API ELB Classic."
              exit 1
            fi

            if ! jq -e '.LoadBalancers | type == "array"' \
              <<< "$V2_JSON" >/dev/null; then
              echo "::error::Resposta invalida da API ELBv2."
              exit 1
            fi

            CLASSIC_COUNT="$(
              jq --arg vpc_id "$VPC_ID" \
                '[.LoadBalancerDescriptions[]? | select(.VPCId == $vpc_id)] | length' \
                <<< "$CLASSIC_JSON"
            )"

            V2_COUNT="$(
              jq --arg vpc_id "$VPC_ID" \
                '[.LoadBalancers[]? | select(.VpcId == $vpc_id)] | length' \
                <<< "$V2_JSON"
            )"

            TOTAL_COUNT="$((CLASSIC_COUNT + V2_COUNT))"

            echo "Tentativa $attempt/60: Classic=$CLASSIC_COUNT ALB/NLB=$V2_COUNT Total=$TOTAL_COUNT"

            if [[ "$TOTAL_COUNT" -eq 0 ]]; then
              echo "Todos os Load Balancers da VPC foram removidos."
              exit 0
            fi

            if [[ "$attempt" -lt 60 ]]; then
              sleep 10
            fi
          done

          echo "::error::Ainda existem Load Balancers associados a VPC $VPC_ID."
          echo "::error::Confira Services LoadBalancer e Ingresses restantes."
          exit 1

      - name: Gerar plano de destroy
        timeout-minutes: 10
        env:
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          terraform plan \
            -destroy \
            -out=destroy.tfplan

          terraform show \
            -no-color \
            destroy.tfplan \
            > /tmp/terraform-destroy-plan.txt

          cat /tmp/terraform-destroy-plan.txt

          if ! grep -Fq "# module.vpc.aws_vpc.this[0] will be destroyed" \
            /tmp/terraform-destroy-plan.txt; then
            echo "::error::O plano nao inclui a destruicao da VPC remanescente."
            exit 1
          fi

          if grep -Fq "# aws_eks_cluster.main will be destroyed" \
            /tmp/terraform-destroy-plan.txt; then
            echo "Plano inclui o cluster EKS."
          else
            echo "::notice::Cluster EKS ausente do plano porque ja foi removido."
          fi

          echo "Plano de destroy validado para execucao inicial ou retomada."

      - name: Aplicar destroy
        timeout-minutes: 35
        env:
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
          AWS_PAGER: ""
        run: |
          set -euo pipefail
          terraform apply -auto-approve destroy.tfplan

      - name: Confirmar state vazio
        timeout-minutes: 2
        run: |
          set -euo pipefail

          terraform state list > /tmp/terraform-state-after-destroy.txt

          if [[ -s /tmp/terraform-state-after-destroy.txt ]]; then
            echo "::error::Ainda existem recursos no Terraform state:"
            cat /tmp/terraform-state-after-destroy.txt
            exit 1
          fi

          echo "State vazio. Infraestrutura destruida com sucesso."

      - name: Gerar diagnostico
        if: always()
        working-directory: .
        run: |
          {
            echo "===== EXECUCAO ====="
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "region=${AWS_REGION}"
            echo "vpc_id=${VPC_ID:-nao-obtido}"
            echo "eks_available=${EKS_AVAILABLE:-nao-avaliado}"

            echo
            echo "===== STATE ANTES ====="
            cat /tmp/terraform-state-resources.txt 2>/dev/null || true

            echo
            echo "===== PLANO DE DESTROY ====="
            tail -n 200 /tmp/terraform-destroy-plan.txt 2>/dev/null || true

            echo
            echo "===== STATE DEPOIS ====="
            cat /tmp/terraform-state-after-destroy.txt 2>/dev/null || true

            echo
            echo "===== ERRO EKS ====="
            cat /tmp/eks-describe-error.txt 2>/dev/null || true

            echo
            echo "===== ERRO CLASSIC LB ====="
            cat /tmp/classic-lb-error.txt 2>/dev/null || true

            echo
            echo "===== ERRO ELBV2 ====="
            cat /tmp/v2-lb-error.txt 2>/dev/null || true
          } > infrastructure-destroy-diagnostics.txt 2>&1

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infrastructure-destroy-diagnostics
          path: infrastructure-destroy-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
