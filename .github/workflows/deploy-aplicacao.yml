name: Aplicacao

run-name: >-
  Aplicacao - ${{ inputs.action }} -
  ${{ inputs.image || vars.DEFAULT_APP_IMAGE || 'michaelhion/oficina360:latest' }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao
        required: true
        type: choice
        options:
          - validate
          - deploy
          - destroy

      image:
        description: Imagem opcional. Se vazia, usa DEFAULT_APP_IMAGE ou michaelhion/oficina360:latest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: oficina360-aplicacao
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NAMESPACE: oficina360
  DEFAULT_APP_IMAGE: ${{ vars.DEFAULT_APP_IMAGE || 'michaelhion/oficina360:latest' }}

jobs:
  application:
    name: Aplicacao ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolver imagem
        if: inputs.action == 'deploy'
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          IMAGE="${INPUT_IMAGE:-$DEFAULT_APP_IMAGE}"
          : "${IMAGE:?Nenhuma imagem foi informada e DEFAULT_APP_IMAGE nao esta definida}"

          if [[ "$IMAGE" =~ [[:space:]] ]]; then
            echo "::error::Informe somente a referencia da imagem, sem docker pull ou espacos."
            exit 1
          fi

          if [[ "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            IMAGE_MODE="immutable"
          elif [[ "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._/-]+:[0-9a-f]{7,40}$ ]]; then
            IMAGE_MODE="immutable"
          elif [[ "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._/-]+:latest$ ]]; then
            IMAGE_MODE="latest"
            echo "::warning::Usando tag latest. O deploy nao sera reprodutivel."
          else
            echo "::error::Formato de imagem invalido."
            echo "::error::Use usuario/repositorio:<git-sha>, usuario/repositorio@sha256:<digest> ou usuario/repositorio:latest."
            exit 1
          fi

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_MODE=$IMAGE_MODE" >> "$GITHUB_ENV"
          echo "Imagem resolvida: $IMAGE"
          echo "Modo: $IMAGE_MODE"

      - name: Mostrar parametros da execucao
        run: |
          echo "action=${{ inputs.action }}"
          echo "input_image=${{ inputs.image || 'nao informada' }}"
          echo "default_image=$DEFAULT_APP_IMAGE"
          echo "branch=${GITHUB_REF_NAME}"
          echo "commit=${GITHUB_SHA}"

      - name: Instalar kubeconform
        if: inputs.action == 'validate'
        env:
          KUBECONFORM_VERSION: "0.7.0"
        run: |
          set -euo pipefail

          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validar manifests
        if: inputs.action == 'validate'
        env:
          IMAGE: docker.io/michaelhion/oficina360-api:0123456
        run: |
          set -euo pipefail

          export IMAGE
          envsubst '${IMAGE}' \
            < k8s/aws/api-deployment.yaml \
            > /tmp/api-deployment.yaml

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            k8s/aws/namespace.yaml \
            k8s/aws/api-service.yaml \
            /tmp/api-deployment.yaml

      - name: Configurar credenciais AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar acesso ao EKS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          : "${EKS_CLUSTER_NAME:?Repository Variable EKS_CLUSTER_NAME nao definida}"

          CLUSTER_STATUS="$(
            aws eks describe-cluster \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query 'cluster.status' \
              --output text
          )"

          if [[ "$CLUSTER_STATUS" != "ACTIVE" ]]; then
            echo "::error::Cluster EKS nao esta ACTIVE. Status: $CLUSTER_STATUS"
            exit 1
          fi

          export KUBECONFIG="$RUNNER_TEMP/oficina360-kubeconfig"
          rm -f "$KUBECONFIG"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias oficina360 \
            --kubeconfig "$KUBECONFIG"

          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Verificar permissoes Kubernetes
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: |
          set -euo pipefail

          kubectl config current-context
          kubectl get nodes -o wide
          kubectl auth can-i get namespaces

          if [[ "${{ inputs.action }}" == "deploy" ]]; then
            kubectl auth can-i create namespaces
            kubectl auth can-i create deployments --namespace "$NAMESPACE"
          fi

      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail

          : "${IMAGE:?Imagem resolvida nao encontrada}"
          : "${IMAGE_MODE:?Modo da imagem nao encontrado}"
          : "${DATABASE_URL:?Repository Variable DATABASE_URL nao definida}"
          : "${DB_USERNAME:?GitHub Secret DB_USERNAME nao definido}"
          : "${DB_PASSWORD:?GitHub Secret DB_PASSWORD nao definido}"
          : "${JWT_SECRET:?GitHub Secret JWT_SECRET nao definido}"

          if [[ ! "$DATABASE_URL" =~ ^jdbc:postgresql://([^/:]+):([0-9]+)/([^/?]+)$ ]]; then
            echo "::error::DATABASE_URL deve usar jdbc:postgresql://host:porta/banco"
            exit 1
          fi

          DATABASE_HOST="${BASH_REMATCH[1]}"
          DATABASE_PORT="${BASH_REMATCH[2]}"
          DATABASE_NAME="${BASH_REMATCH[3]}"

          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"

          echo "Banco configurado:"
          echo "Host: $DATABASE_HOST"
          echo "Porta: $DATABASE_PORT"
          echo "Database: $DATABASE_NAME"

          kubectl apply -f k8s/aws/namespace.yaml
          kubectl get namespace "$NAMESPACE"

          kubectl create configmap oficina360-config \
            --namespace "$NAMESPACE" \
            --from-literal=DB_HOST="$DATABASE_HOST" \
            --from-literal=DB_PORT="$DATABASE_PORT" \
            --from-literal=DB_NAME="$DATABASE_NAME" \
            --from-literal=SPRING_PROFILES_ACTIVE=docker \
            --from-literal=SERVER_PORT=8081 \
            --dry-run=client \
            --output yaml |
            kubectl apply -f -

          kubectl create secret generic oficina360-secret \
            --namespace "$NAMESPACE" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client \
            --output yaml |
            kubectl apply -f -

          export IMAGE
          envsubst '${IMAGE}' \
            < k8s/aws/api-deployment.yaml \
            > /tmp/api-deployment.yaml

          kubectl apply -f /tmp/api-deployment.yaml
          kubectl apply -f k8s/aws/api-service.yaml

          if [[ "$IMAGE_MODE" == "latest" ]]; then
            echo "Tag latest detectada. Forcando novo rollout para consultar o registry."
            kubectl rollout restart \
              deployment/oficina360-api \
              --namespace "$NAMESPACE"
          fi

          kubectl rollout status \
            deployment/oficina360-api \
            --namespace "$NAMESPACE" \
            --timeout=5m

          DEPLOYED_IMAGE="$(
            kubectl get deployment oficina360-api \
              --namespace "$NAMESPACE" \
              --output jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          echo "Imagem solicitada: $IMAGE"
          echo "Imagem implantada: $DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != "$IMAGE" ]]; then
            echo "::error::Imagem implantada diferente da imagem solicitada."
            exit 1
          fi

          kubectl get deployment,pod,service \
            --namespace "$NAMESPACE" \
            --output wide

      - name: Verificar deploy
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          kubectl get namespace "$NAMESPACE"
          kubectl get configmap oficina360-config --namespace "$NAMESPACE"
          kubectl get secret oficina360-secret --namespace "$NAMESPACE"
          kubectl get service oficina360-api --namespace "$NAMESPACE"

          kubectl rollout status \
            deployment/oficina360-api \
            --namespace "$NAMESPACE" \
            --timeout=1m

          READY_REPLICAS="$(
            kubectl get deployment oficina360-api \
              --namespace "$NAMESPACE" \
              --output jsonpath='{.status.readyReplicas}'
          )"

          AVAILABLE_REPLICAS="$(
            kubectl get deployment oficina360-api \
              --namespace "$NAMESPACE" \
              --output jsonpath='{.status.availableReplicas}'
          )"

          [[ "${READY_REPLICAS:-0}" -ge 1 ]] || {
            echo "::error::Deployment sem replicas prontas."
            exit 1
          }

          [[ "${AVAILABLE_REPLICAS:-0}" -ge 1 ]] || {
            echo "::error::Deployment sem replicas disponiveis."
            exit 1
          }

          echo "Deploy validado com sucesso."

      - name: Destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          kubectl delete namespace "$NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            --timeout=5m

          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "::error::Namespace $NAMESPACE ainda existe."
            exit 1
          fi

          echo "Namespace $NAMESPACE removido."

      - name: Gerar diagnostico
        if: always() && inputs.action != 'validate'
        run: |
          {
            echo "===== EXECUCAO ====="
            echo "action=${{ inputs.action }}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "image=${IMAGE:-nao resolvida}"

            echo
            echo "===== CONTEXTO ====="
            kubectl config current-context || true

            echo
            echo "===== NODES ====="
            kubectl get nodes -o wide || true

            echo
            echo "===== NAMESPACE ====="
            kubectl get namespace "$NAMESPACE" || true

            echo
            echo "===== WORKLOADS ====="
            kubectl get all --namespace "$NAMESPACE" --output wide || true

            echo
            echo "===== CONFIGMAP ====="
            kubectl get configmap oficina360-config --namespace "$NAMESPACE" || true

            echo
            echo "===== SECRET KEYS ====="
            kubectl get secret oficina360-secret \
              --namespace "$NAMESPACE" \
              --output json 2>/dev/null |
              jq -r '.data | keys[]' || true

            echo
            echo "===== EVENTS ====="
            kubectl get events \
              --namespace "$NAMESPACE" \
              --sort-by=.lastTimestamp || true

            echo
            echo "===== DEPLOYMENT DESCRIPTION ====="
            kubectl describe deployment oficina360-api \
              --namespace "$NAMESPACE" || true

            echo
            echo "===== POD DESCRIPTIONS ====="
            kubectl describe pods \
              --namespace "$NAMESPACE" \
              --selector app=oficina360-api || true
          } > application-diagnostics.txt 2>&1

      - name: Publicar diagnostico
        if: always() && inputs.action != 'validate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-diagnostics
          path: application-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
