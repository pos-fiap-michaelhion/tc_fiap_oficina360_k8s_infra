name: Aplicacao

run-name: Aplicacao - ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao
        required: true
        type: choice
        options:
          - validate
          - deploy
          - destroy

      image:
        description: Imagem opcional. Se vazia, usa DEFAULT_APP_IMAGE
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: oficina360-aplicacao
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NAMESPACE: oficina360
  PROJECT_NAME: oficina360
  DEFAULT_APP_IMAGE: ${{ vars.DEFAULT_APP_IMAGE || 'michaelhion/oficina360:latest' }}

jobs:
  application:
    name: Aplicacao ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolver imagem
        if: inputs.action == 'deploy'
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          IMAGE="${INPUT_IMAGE:-$DEFAULT_APP_IMAGE}"
          : "${IMAGE:?Nenhuma imagem foi informada e DEFAULT_APP_IMAGE nao esta definida}"

          if [[ "$IMAGE" =~ [[:space:]] ]]; then
            echo "::error::Informe somente a referencia da imagem, sem comandos ou espacos."
            exit 1
          fi

          if [[ "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            IMAGE_MODE="immutable"
          elif [[ "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._/-]+:[0-9a-f]{7,40}$ ]]; then
            IMAGE_MODE="immutable"
          elif [[ "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._/-]+:latest$ ]]; then
            IMAGE_MODE="latest"
            echo "::warning::Usando tag latest. O deploy nao sera reprodutivel."
          else
            echo "::error::Formato de imagem invalido."
            exit 1
          fi

          echo "::add-mask::$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_MODE=$IMAGE_MODE" >> "$GITHUB_ENV"

          echo "Imagem validada."
          echo "Modo da imagem: $IMAGE_MODE"

      - name: Mostrar parametros sanitizados
        run: |
          set -euo pipefail
          echo "Acao: ${{ inputs.action }}"
          echo "Regiao configurada."
          echo "Parametros sensiveis e identificadores foram omitidos."

      - name: Instalar kubeconform
        if: inputs.action == 'validate'
        env:
          KUBECONFORM_VERSION: "0.7.0"
        run: |
          set -euo pipefail

          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validar manifests
        if: inputs.action == 'validate'
        env:
          IMAGE: docker.io/example/oficina360-api:0123456
        run: |
          set -euo pipefail

          export IMAGE
          envsubst '${IMAGE}' \
            < k8s/aws/api-deployment.yaml \
            > /tmp/api-deployment.yaml

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            k8s/aws/namespace.yaml \
            k8s/aws/api-service.yaml \
            /tmp/api-deployment.yaml

      - name: Configurar credenciais AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS sem expor dados
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: |
          set -euo pipefail

          IDENTITY_JSON="$(aws sts get-caller-identity --output json)"
          ACCOUNT_ID="$(jq -r '.Account' <<< "$IDENTITY_JSON")"
          CALLER_ARN="$(jq -r '.Arn' <<< "$IDENTITY_JSON")"
          USER_ID="$(jq -r '.UserId' <<< "$IDENTITY_JSON")"

          : "${ACCOUNT_ID:?Conta AWS nao identificada}"
          : "${CALLER_ARN:?Caller ARN nao identificado}"
          : "${USER_ID:?User ID nao identificado}"

          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$CALLER_ARN"
          echo "::add-mask::$USER_ID"
          echo "::add-mask::${CALLER_ARN##*/}"

          echo "Identidade AWS validada."

      - name: Descobrir e configurar cluster EKS atual
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: |
          set -euo pipefail

          mapfile -t CLUSTERS < <(
            aws eks list-clusters \
              --region "$AWS_REGION" \
              --query 'clusters[]' \
              --output text |
            tr '\t' '\n' |
            sed '/^$/d'
          )

          [[ "${#CLUSTERS[@]}" -gt 0 ]] || {
            echo "::error::Nenhum cluster EKS encontrado na regiao configurada."
            exit 1
          }

          CANDIDATES=()

          for cluster_name in "${CLUSTERS[@]}"; do
            CLUSTER_JSON="$(
              aws eks describe-cluster \
                --name "$cluster_name" \
                --region "$AWS_REGION" \
                --output json
            )"

            CLUSTER_PROJECT="$(jq -r '.cluster.tags.Project // empty' <<< "$CLUSTER_JSON")"
            CLUSTER_ENVIRONMENT="$(jq -r '.cluster.tags.Environment // empty' <<< "$CLUSTER_JSON")"

            if [[ "$cluster_name" == "$PROJECT_NAME" ]] ||
               [[ "$CLUSTER_PROJECT" == "$PROJECT_NAME" && "$CLUSTER_ENVIRONMENT" == "lab" ]]; then
              CANDIDATES+=("$cluster_name")
            fi
          done

          if [[ "${#CANDIDATES[@]}" -eq 0 && "${#CLUSTERS[@]}" -eq 1 ]]; then
            CANDIDATES=("${CLUSTERS[0]}")
          fi

          [[ "${#CANDIDATES[@]}" -eq 1 ]] || {
            echo "::error::Nao foi possivel selecionar um unico cluster EKS."
            exit 1
          }

          EKS_CLUSTER_NAME="${CANDIDATES[0]}"
          echo "::add-mask::$EKS_CLUSTER_NAME"

          CLUSTER_STATUS="$(
            aws eks describe-cluster \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query 'cluster.status' \
              --output text
          )"

          [[ "$CLUSTER_STATUS" == "ACTIVE" ]] || {
            echo "::error::O cluster EKS nao esta ACTIVE."
            exit 1
          }

          KUBECONFIG_PATH="$RUNNER_TEMP/oficina360-kubeconfig"
          rm -f "$KUBECONFIG_PATH"

          # GITHUB_ENV so vale para os proximos steps. O export e necessario
          # para que o kubectl deste mesmo step use o arquivo recem-criado.
          export KUBECONFIG="$KUBECONFIG_PATH"

          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME" >> "$GITHUB_ENV"

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias oficina360 \
            --kubeconfig "$KUBECONFIG" \
            >/dev/null

          test -s "$KUBECONFIG" || {
            echo "::error::O kubeconfig nao foi criado."
            exit 1
          }

          CURRENT_CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
          [[ "$CURRENT_CONTEXT" == "oficina360" ]] || {
            echo "::error::O contexto Kubernetes esperado nao foi ativado."
            exit 1
          }

          if ! kubectl --request-timeout=20s auth can-i get namespaces >/dev/null; then
            echo "::error::Nao foi possivel autenticar no cluster EKS."
            exit 1
          fi

          echo "Acesso ao cluster configurado."

      - name: Verificar permissoes Kubernetes
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: |
          set -euo pipefail

          kubectl auth can-i get namespaces >/dev/null

          if [[ "${{ inputs.action }}" == "deploy" ]]; then
            kubectl auth can-i create namespaces >/dev/null
            kubectl auth can-i create deployments --namespace "$NAMESPACE" >/dev/null
          fi

          echo "Permissoes Kubernetes validadas."

      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || 'oficina360-auth' }}
        run: |
          set -euo pipefail

          : "${IMAGE:?Imagem resolvida nao encontrada}"
          : "${IMAGE_MODE:?Modo da imagem nao encontrado}"
          : "${DATABASE_URL:?Repository Variable DATABASE_URL nao definida}"
          : "${DB_USERNAME:?GitHub Secret DB_USERNAME nao definido}"
          : "${DB_PASSWORD:?GitHub Secret DB_PASSWORD nao definido}"
          : "${JWT_SECRET:?GitHub Secret JWT_SECRET nao definido}"

          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$IMAGE"

          if [[ ! "$DATABASE_URL" =~ ^jdbc:postgresql://([^/:]+):([0-9]+)/([^/?]+)$ ]]; then
            echo "::error::DATABASE_URL deve usar jdbc:postgresql://host:porta/banco"
            exit 1
          fi

          DATABASE_HOST="${BASH_REMATCH[1]}"
          DATABASE_PORT="${BASH_REMATCH[2]}"
          DATABASE_NAME="${BASH_REMATCH[3]}"

          echo "::add-mask::$DATABASE_HOST"
          echo "::add-mask::$DATABASE_PORT"
          echo "::add-mask::$DATABASE_NAME"

          kubectl apply -f k8s/aws/namespace.yaml >/dev/null

          kubectl create configmap oficina360-config \
            --namespace "$NAMESPACE" \
            --from-literal=DB_HOST="$DATABASE_HOST" \
            --from-literal=DB_PORT="$DATABASE_PORT" \
            --from-literal=DB_NAME="$DATABASE_NAME" \
            --from-literal=SPRING_PROFILES_ACTIVE=docker \
            --from-literal=SERVER_PORT=8081 \
            --dry-run=client \
            --output yaml |
            kubectl apply -f - >/dev/null

          kubectl create secret generic oficina360-secret \
            --namespace "$NAMESPACE" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client \
            --output yaml |
            kubectl apply -f - >/dev/null

          export IMAGE
          envsubst '${IMAGE}' \
            < k8s/aws/api-deployment.yaml \
            > /tmp/api-deployment.yaml

          kubectl apply -f /tmp/api-deployment.yaml >/dev/null
          kubectl apply -f k8s/aws/api-service.yaml >/dev/null

          if [[ "$IMAGE_MODE" == "latest" ]]; then
            kubectl rollout restart \
              deployment/oficina360-api \
              --namespace "$NAMESPACE" \
              >/dev/null
          fi

          kubectl rollout status \
            deployment/oficina360-api \
            --namespace "$NAMESPACE" \
            --timeout=5m

          DEPLOYED_IMAGE="$(
            kubectl get deployment oficina360-api \
              --namespace "$NAMESPACE" \
              --output jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          echo "::add-mask::$DEPLOYED_IMAGE"

          [[ "$DEPLOYED_IMAGE" == "$IMAGE" ]] || {
            echo "::error::Imagem implantada diferente da imagem solicitada."
            exit 1
          }

          echo "Aplicacao implantada com sucesso."

      - name: Verificar deploy
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/oficina360-api \
            --namespace "$NAMESPACE" \
            --timeout=1m

          READY_REPLICAS="$(
            kubectl get deployment oficina360-api \
              --namespace "$NAMESPACE" \
              --output jsonpath='{.status.readyReplicas}'
          )"

          AVAILABLE_REPLICAS="$(
            kubectl get deployment oficina360-api \
              --namespace "$NAMESPACE" \
              --output jsonpath='{.status.availableReplicas}'
          )"

          [[ "${READY_REPLICAS:-0}" -ge 1 ]] || {
            echo "::error::Deployment sem replicas prontas."
            exit 1
          }

          [[ "${AVAILABLE_REPLICAS:-0}" -ge 1 ]] || {
            echo "::error::Deployment sem replicas disponiveis."
            exit 1
          }

          echo "Deploy validado com sucesso."
          echo "Replicas prontas: $READY_REPLICAS"
          echo "Replicas disponiveis: $AVAILABLE_REPLICAS"

      - name: Destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          kubectl delete namespace "$NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            --timeout=5m \
            >/dev/null

          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "::error::Namespace ainda existe."
            exit 1
          fi

          echo "Namespace removido."

      - name: Gerar diagnostico sanitizado
        if: failure() && inputs.action != 'validate'
        run: |
          set -euo pipefail

          NAMESPACE_EXISTS="false"
          DEPLOYMENT_EXISTS="false"
          READY_REPLICAS="0"
          AVAILABLE_REPLICAS="0"
          POD_COUNT="0"
          FAILED_POD_COUNT="0"

          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            NAMESPACE_EXISTS="true"
          fi

          if kubectl get deployment oficina360-api \
            --namespace "$NAMESPACE" \
            >/dev/null 2>&1; then

            DEPLOYMENT_EXISTS="true"
            READY_REPLICAS="$(
              kubectl get deployment oficina360-api \
                --namespace "$NAMESPACE" \
                --output jsonpath='{.status.readyReplicas}' 2>/dev/null ||
              echo 0
            )"
            AVAILABLE_REPLICAS="$(
              kubectl get deployment oficina360-api \
                --namespace "$NAMESPACE" \
                --output jsonpath='{.status.availableReplicas}' 2>/dev/null ||
              echo 0
            )"
          fi

          POD_COUNT="$(
            kubectl get pods \
              --namespace "$NAMESPACE" \
              --selector app=oficina360-api \
              --no-headers 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          FAILED_POD_COUNT="$(
            kubectl get pods \
              --namespace "$NAMESPACE" \
              --selector app=oficina360-api \
              --field-selector=status.phase=Failed \
              --no-headers 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          {
            echo "status=failure"
            echo "action=${{ inputs.action }}"
            echo "namespace_exists=$NAMESPACE_EXISTS"
            echo "deployment_exists=$DEPLOYMENT_EXISTS"
            echo "ready_replicas=${READY_REPLICAS:-0}"
            echo "available_replicas=${AVAILABLE_REPLICAS:-0}"
            echo "pod_count=${POD_COUNT:-0}"
            echo "failed_pod_count=${FAILED_POD_COUNT:-0}"
          } > application-diagnostics.txt

      - name: Publicar diagnostico sanitizado
        if: failure() && inputs.action != 'validate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-diagnostics
          path: application-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
