name: Infrastructure Apply

run-name: Infrastructure ${{ inputs.action }} - Kubernetes ${{ inputs.kubernetes_version }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao da infraestrutura
        required: true
        type: choice
        options:
          - validate
          - deploy

      kubernetes_version:
        description: Versao do Kubernetes aceita pelo lab
        required: true
        default: "1.36"
        type: string

      allow_cluster_replacement:
        description: Permitir recriar recursos EKS apos reset do Learner Lab
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: oficina360-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: oficina360
  TF_VAR_kubernetes_version: ${{ inputs.kubernetes_version }}

jobs:
  infrastructure:
    name: Infrastructure ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: terraform/lab

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Mostrar parametros da execucao
        working-directory: .
        run: |
          set -euo pipefail
          echo "action=${{ inputs.action }}"
          echo "kubernetes_version=${{ inputs.kubernetes_version }}"
          echo "allow_cluster_replacement=${{ inputs.allow_cluster_replacement }}"
          echo "branch=${GITHUB_REF_NAME}"
          echo "commit=${GITHUB_SHA}"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init for validation
        if: inputs.action == 'validate'
        run: terraform init -backend=false

      - name: Terraform validate
        if: inputs.action == 'validate'
        env:
          TF_VAR_eks_cluster_role_arn: arn:aws:iam::000000000000:role/LabEksClusterRole
          TF_VAR_eks_node_role_arn: arn:aws:iam::000000000000:role/LabEksNodeRole
        run: terraform validate

      - name: Configure AWS credentials
        if: inputs.action == 'deploy'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        run: |
          set -euo pipefail

          IDENTITY_JSON="$(aws sts get-caller-identity --output json)"
          ACCOUNT_ID="$(jq -r '.Account' <<< "$IDENTITY_JSON")"
          CALLER_ARN="$(jq -r '.Arn' <<< "$IDENTITY_JSON")"
          USER_ID="$(jq -r '.UserId' <<< "$IDENTITY_JSON")"

          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$CALLER_ARN"
          echo "::add-mask::$USER_ID"

          if [[ "$CALLER_ARN" == *"="* ]]; then
            SESSION_NAME="${CALLER_ARN##*=}"
            echo "::add-mask::$SESSION_NAME"
          fi

          echo "AWS_IDENTITY_VALIDATED=true" >> "$GITHUB_ENV"
          echo "Identidade AWS validada com sucesso."

      - name: Resolver roles EKS da conta atual
        if: inputs.action == 'deploy'
        timeout-minutes: 2
        working-directory: .
        env:
          EKS_CLUSTER_ROLE_ARN_CONFIGURED: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
          EKS_NODE_ROLE_ARN_CONFIGURED: ${{ vars.EKS_NODE_ROLE_ARN }}
          EKS_CLUSTER_ROLE_NAME: ${{ vars.EKS_CLUSTER_ROLE_NAME || 'LabEksClusterRole' }}
          EKS_NODE_ROLE_NAME: ${{ vars.EKS_NODE_ROLE_NAME || 'LabEksNodeRole' }}
        run: |
          set -euo pipefail
          bash scripts/resolve-lab-roles.sh

      - name: Criar ou validar backend Terraform
        if: inputs.action == 'deploy'
        timeout-minutes: 4
        working-directory: .
        env:
          TF_STATE_BUCKET_CONFIGURED: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY_CONFIGURED: ${{ vars.TF_STATE_KEY }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          DEFAULT_BUCKET="oficina360-tfstate-${ACCOUNT_ID}-${AWS_REGION}"

          if [[ -n "$TF_STATE_BUCKET_CONFIGURED" ]] &&
             [[ "$TF_STATE_BUCKET_CONFIGURED" == *"${ACCOUNT_ID}"* ]]; then
            TF_STATE_BUCKET="$TF_STATE_BUCKET_CONFIGURED"
          else
            TF_STATE_BUCKET="$DEFAULT_BUCKET"
          fi

          TF_STATE_KEY="${TF_STATE_KEY_CONFIGURED:-oficina360/lab.tfstate}"

          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$TF_STATE_BUCKET"

          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Backend ausente na conta atual. Criando bucket de state..."

            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" >/dev/null
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION" >/dev/null
            fi
          fi

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"
          echo "Backend Terraform pronto."

      - name: Terraform init with remote backend
        if: inputs.action == 'deploy'
        timeout-minutes: 5
        env:
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate before deploy
        if: inputs.action == 'deploy'
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'deploy'
        timeout-minutes: 15
        env:
          ALLOW_CLUSTER_REPLACEMENT: ${{ inputs.allow_cluster_replacement }}
        run: |
          set -euo pipefail

          terraform plan -out=tfplan
          terraform show -no-color tfplan > /tmp/tfplan.txt

          echo "===== RESUMO DO PLANO ====="
          grep -E \
            'Plan:|will be imported|will be created|will be updated|will be destroyed|must be replaced' \
            /tmp/tfplan.txt || true

          mapfile -t DESTRUCTIVE_RESOURCES < <(
            sed -nE \
              's/^  # ([^ ]+) (will be destroyed|must be replaced)$/\1/p' \
              /tmp/tfplan.txt
          )

          if [[ "${#DESTRUCTIVE_RESOURCES[@]}" -gt 0 ]]; then
            echo "===== RECURSOS DESTRUTIVOS ====="
            printf '%s\n' "${DESTRUCTIVE_RESOURCES[@]}"

            if [[ "$ALLOW_CLUSTER_REPLACEMENT" != "true" ]]; then
              echo "::error::O plano contem destruicoes ou substituicoes."
              echo "::error::Revise o plano e execute novamente com allow_cluster_replacement=true."
              exit 1
            fi

            UNEXPECTED_DESTRUCTIVE="false"
            for resource in "${DESTRUCTIVE_RESOURCES[@]}"; do
              case "$resource" in
                aws_eks_cluster.main|aws_eks_node_group.main|aws_eks_addon.*)
                  echo "::warning::Substituicao EKS autorizada: $resource"
                  ;;
                *)
                  echo "::error::Recurso destrutivo nao autorizado: $resource"
                  UNEXPECTED_DESTRUCTIVE="true"
                  ;;
              esac
            done

            if [[ "$UNEXPECTED_DESTRUCTIVE" == "true" ]]; then
              exit 1
            fi
          fi

          if grep -Eq '^  # module\.vpc\..* (will be destroyed|must be replaced)$' \
            /tmp/tfplan.txt; then
            echo "::error::O plano tenta destruir ou substituir recursos da VPC."
            exit 1
          fi

          if grep -Eq '^  # aws_security_group\.database_access (will be destroyed|must be replaced)$' \
            /tmp/tfplan.txt; then
            echo "::error::O plano tenta destruir ou substituir o Security Group compartilhado."
            exit 1
          fi

          PLANNED_NODE_ROLE="$(
            sed -nE \
              's/^[[:space:]]*\+?[[:space:]]*node_role_arn[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              /tmp/tfplan.txt |
            head -n 1
          )"

          if grep -Eq '^  # aws_eks_node_group\.main (will be created|must be replaced)$' \
            /tmp/tfplan.txt; then
            if [[ -z "$PLANNED_NODE_ROLE" ]]; then
              echo "::error::Nao foi possivel localizar node_role_arn no plano."
              exit 1
            fi

            echo "Node role planejada: ${PLANNED_NODE_ROLE##*/}"

            if [[ "$PLANNED_NODE_ROLE" == *LabEksClusterRole* ]]; then
              echo "::error::Uma cluster role foi configurada no node group."
              exit 1
            fi
          else
            echo "Node group nao sera criado ou substituido neste plano."
          fi

          echo "Plano aprovado para apply."

      - name: Terraform apply
        if: inputs.action == 'deploy'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          terraform apply -auto-approve tfplan

      - name: Descobrir e configurar cluster EKS atual
        if: inputs.action == 'deploy'
        timeout-minutes: 18
        working-directory: .
        env:
          PROJECT_NAME: oficina360
          ENVIRONMENT: lab
          AWS_REGION: ${{ env.AWS_REGION }}
          WAIT_SECONDS: "900"
        run: |
          set -euo pipefail
          bash scripts/resolve-eks-runtime.sh

      - name: Validar cluster e node group
        if: inputs.action == 'deploy'
        timeout-minutes: 8
        working-directory: .
        run: |
          set -euo pipefail

          kubectl get nodes -o wide
          kubectl get pods --namespace kube-system --output wide

          READY_NODES="$(
            kubectl get nodes --no-headers |
            awk '$2 == "Ready" {count++} END {print count+0}'
          )"

          if [[ "$READY_NODES" -lt 1 ]]; then
            echo "::error::Nenhum node Ready encontrado."
            exit 1
          fi

          echo "Nodes Ready: $READY_NODES"

      - name: Gerar resumo da infraestrutura atual
        if: inputs.action == 'deploy'
        working-directory: .
        run: |
          set -euo pipefail

          {
            echo "status=success"
            echo "region=$AWS_REGION"
            echo "project=oficina360"
            echo "cluster_discovered=true"
            echo "nodes_ready=$(kubectl get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count+0}')"
          } | tee infrastructure-runtime-summary.txt

      - name: Publicar resumo da infraestrutura
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infrastructure-runtime-summary
          path: infrastructure-runtime-summary.txt
          if-no-files-found: error
          retention-days: 1
